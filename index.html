<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0e0e10">
    <title>Stream Pulse</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://player.twitch.tv/js/embed/v1.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        :root {
            --purple: #9147ff;
            --purple-light: #bf94ff;
            --green: #00ff88;
            --red: #ff4d6d;
            --bg: #0e0e10;
            --card-bg: #18181b;
            --border: #303032;
        }

        body { background: var(--bg); color: #efeff1; min-height: 100vh; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 1400px; padding: 20px; padding-bottom: 50px; }

        .header { text-align: center; margin-bottom: 24px; }
        .header h1 { font-size: 2rem; font-weight: 800; color: #fff; margin-bottom: 4px; }
        .header p { color: #adadb8; font-size: 0.9rem; }

        .controls { display: flex; gap: 10px; margin: 0 auto 30px; max-width: 600px; }
        input { flex: 1; min-width: 0; padding: 14px 18px; border-radius: 10px; border: 1px solid var(--border); background: var(--card-bg); color: #fff; font-size: 16px; outline: none; }
        input:focus { border-color: var(--purple); }
        .add-btn { padding: 14px 24px; background: var(--purple); color: #fff; border: none; border-radius: 10px; font-weight: bold; font-size: 1rem; cursor: pointer; }
        .add-btn:hover { background: #7a35e6; }

        /* Карточки */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-bottom: 40px; }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
        .card.live { border-color: rgba(0, 255, 136, 0.4); }

        .card-header { display: flex; align-items: center; gap: 12px; }
        
        /* Аватарка */
        .avatar {
            width: 48px; height: 48px; border-radius: 50%;
            background: #2a2a2d; display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 1.2rem; color: var(--purple-light);
            overflow: hidden; border: 2px solid transparent; flex-shrink: 0;
        }
        .card.live .avatar { border-color: var(--green); }
        .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .card-title-wrap { flex: 1; min-width: 0; }
        .card-title { font-weight: 800; font-size: 1rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-handle { font-size: 0.75rem; color: #adadb8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .remove-btn { width: 32px; height: 32px; border-radius: 8px; background: rgba(255, 77, 109, 0.1); border: none; color: #ff4d6d; cursor: pointer; flex-shrink: 0; }
        .status { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 6px; font-weight: bold; font-size: 0.75rem; background: rgba(255, 77, 109, 0.1); color: var(--red); align-self: flex-start; }
        .card.live .status { background: rgba(0, 255, 136, 0.1); color: var(--green); }
        
        .info { display: none; background: #000; border-radius: 8px; padding: 12px; font-size: 0.85rem; }
        .card.live .info { display: block; }
        .info-title { font-weight: 600; color: #fff; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .info-meta { display: flex; justify-content: space-between; color: #adadb8; margin-bottom: 6px; }
        .info-viewers { color: var(--green); font-weight: bold; }
        .info-time { display: flex; justify-content: space-between; padding-top: 8px; border-top: 1px solid var(--border); color: var(--purple-light); font-weight: bold; }

        .watch-btn { display: none; width: 100%; padding: 12px; background: var(--purple); color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .card.live .watch-btn { display: block; }

        /* Плееры */
        .streams-section { display: none; }
        .streams-section.active { display: block; }
        .streams-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
        .streams-header h2 { font-size: 1.2rem; color: #fff; }
        .close-all-btn { background: rgba(255, 77, 109, 0.15); color: var(--red); border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        .players-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; }
        .player-wrapper { background: #000; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); display: flex; flex-direction: column; }
        
        .player-header { padding: 10px 14px; background: var(--card-bg); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 10px; }
        .player-title { font-weight: bold; font-size: 0.9rem; color: #fff; display: flex; align-items: center; gap: 8px; }
        .player-title::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
        
        .volume-control { display: flex; align-items: center; gap: 8px; color: #adadb8; }
        .volume-control input[type="range"] { width: 80px; cursor: pointer; accent-color: var(--purple); }
        
        .player-close { background: transparent; border: none; color: #adadb8; cursor: pointer; font-size: 1.2rem; padding: 0 8px; }
        
        .player-body { display: flex; flex-direction: column; width: 100%; }
        .video-container { width: 100%; aspect-ratio: 16/9; background: #000; }
        .chat-box { width: 100%; height: 400px; background: var(--card-bg); border-top: 1px solid var(--border); position: relative; }
        .chat-box iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }

        /* ПК */
        @media (min-width: 1100px) {
            .card { background: rgba(24, 24, 27, 0.6); backdrop-filter: blur(12px); }
            .player-body { flex-direction: row; }
            .video-container { width: 70%; aspect-ratio: auto; height: 450px; }
            .chat-box { width: 30%; height: 450px; border-top: none; border-left: 1px solid var(--border); }
        }

        /* Телефон */
        @media (max-width: 1099px) {
            .players-grid { grid-template-columns: 1fr; }
            .video-container { height: 300px; aspect-ratio: auto; }
        }
        @media (max-width: 600px) {
            .container { padding: 12px; }
            .header h1 { font-size: 1.5rem; }
            .controls { flex-direction: column; }
            input, .add-btn { width: 100%; }
            .grid { grid-template-columns: 1fr; }
            .video-container { height: 240px; }
            .chat-box { height: 400px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Stream Pulse</h1>
        <p>Твой центр управления стримами</p>
    </div>
    
    <div class="controls">
        <input type="text" id="channelInput" placeholder="Введите ник (например, frik0vna)" autocomplete="off">
        <button class="add-btn" onclick="addChannel()">+ Добавить</button>
    </div>

    <div class="grid" id="grid"></div>

    <div class="streams-section" id="streamsSection">
        <div class="streams-header">
            <h2>Смотрим сейчас</h2>
            <button class="close-all-btn" onclick="closeAllPlayers()">Закрыть все</button>
        </div>
        <div class="players-grid" id="playersGrid"></div>
    </div>
</div>

<script>
    const CLIENT_ID = 'kimne78kx3ncx6brgo4mv6wki5h1ko';
    const PARENT = 'kingjo226.github.io';
    
    let channels = JSON.parse(localStorage.getItem('twitch_channels')) || [];
    let timers = {};
    let openPlayers = new Set(JSON.parse(localStorage.getItem('twitch_open')) || []);
    let twitchPlayers = {};

    function saveChannels() { localStorage.setItem('twitch_channels', JSON.stringify(channels)); }
    function saveOpen() { localStorage.setItem('twitch_open', JSON.stringify([...openPlayers])); }
    function escapeHTML(str) { return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)); }

    function addChannel() {
        const input = document.getElementById('channelInput');
        const name = input.value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
        if (!name || channels.includes(name)) return;
        channels.push(name); saveChannels(); input.value = ''; renderChannels();
    }

    function removeChannel(name) {
        channels = channels.filter(c => c !== name);
        saveChannels(); closePlayer(name);
        if (timers[name]) { clearInterval(timers[name]); delete timers[name]; }
        renderChannels();
    }

    function openPlayer(name) {
        openPlayers.add(name); saveOpen(); renderPlayers();
    }

    function closePlayer(name) {
        openPlayers.delete(name); saveOpen();
        if (twitchPlayers[name]) {
            twitchPlayers[name].destroy();
            delete twitchPlayers[name];
        }
        renderPlayers();
    }

    function closeAllPlayers() {
        openPlayers.forEach(name => {
            if (twitchPlayers[name]) {
                twitchPlayers[name].destroy();
                delete twitchPlayers[name];
            }
        });
        openPlayers.clear(); saveOpen(); renderPlayers();
    }

    function renderChannels() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        
        channels.forEach(name => {
            const card = document.createElement('div');
            card.className = 'card';
            card.id = 'card_' + name;
            card.innerHTML = `
                <div class="card-header">
                    <div class="avatar" id="avatar_${name}">${escapeHTML(name.charAt(0).toUpperCase())}</div>
                    <div class="card-title-wrap">
                        <div class="card-title">${escapeHTML(name)}</div>
                        <div class="card-handle">twitch.tv/${escapeHTML(name)}</div>
                    </div>
                    <button class="remove-btn" onclick="removeChannel('${escapeHTML(name)}')">✕</button>
                </div>
                <div class="status" id="status_${name}">Проверка...</div>
                <div class="info">
                    <div class="info-title" id="title_${name}">Загрузка...</div>
                    <div class="info-meta"><span id="game_${name}">—</span><span class="info-viewers" id="viewers_${name}">0</span></div>
                    <div class="info-time"><span>Длительность</span><span id="time_${name}">00:00:00</span></div>
                </div>
                <button class="watch-btn" onclick="openPlayer('${escapeHTML(name)}')">▶ Смотреть</button>
            `;
            grid.appendChild(card);
            checkStatus(name);
        });
    }

    function renderPlayers() {
        const section = document.getElementById('streamsSection');
        const grid = document.getElementById('playersGrid');
        
        if (openPlayers.size === 0) { section.classList.remove('active'); grid.innerHTML = ''; return; }
        section.classList.add('active');
        
        Array.from(grid.children).forEach(el => {
            const name = el.id.replace('player_', '');
            if (!openPlayers.has(name)) el.remove();
        });

        openPlayers.forEach(name => {
            if (document.getElementById('player_' + name)) return;
            
            const wrapper = document.createElement('div');
            wrapper.className = 'player-wrapper';
            wrapper.id = 'player_' + name;
            wrapper.innerHTML = `
                <div class="player-header">
                    <div class="player-title">${escapeHTML(name)}</div>
                    <div class="volume-control">
                        <span>🔊</span>
                        <input type="range" min="0" max="100" value="0" oninput="changeVolume('${escapeHTML(name)}', this.value)">
                    </div>
                    <button class="player-close" onclick="closePlayer('${escapeHTML(name)}')">✕</button>
                </div>
                <div class="player-body">
                    <div class="video-container" id="video_container_${name}"></div>
                    <div class="chat-box">
                        <iframe src="https://www.twitch.tv/embed/${name}/chat?parent=${PARENT}&darkpopout"></iframe>
                    </div>
                </div>
            `;
            grid.appendChild(wrapper);
            
            setTimeout(() => {
                const player = new Twitch.Player("video_container_" + name, {
                    width: "100%",
                    height: "100%",
                    channel: name,
                    parent: [PARENT],
                    autoplay: true,
                    muted: false
                });
                player.addEventListener(Twitch.Player.READY, () => { player.setVolume(0); });
                twitchPlayers[name] = player;
            }, 100);
        });
    }

    function changeVolume(name, val) {
        if (twitchPlayers[name]) {
            twitchPlayers[name].setVolume(val / 100);
        }
    }

    async function checkStatus(name) {
        const query = {
            query: `query($login: String!) { user(login: $login) { displayName profileImageURL(width: 100) stream { title viewersCount createdAt game { name } } } }`,
            variables: { login: name }
        };
        try {
            const res = await fetch('https://gql.twitch.tv/gql', {
                method: 'POST',
                headers: { 'Client-ID': CLIENT_ID, 'Content-Type': 'application/json' },
                body: JSON.stringify(query)
            });
            const json = await res.json();
            const user = json.data.user;
            const card = document.getElementById('card_' + name);
            if (!card) return;

            if (!user) {
                document.getElementById('status_' + name).innerText = 'Не найден'; card.classList.remove('live'); return;
            }

            // === ИСПРАВЛЕННАЯ ЗАГРУЗКА АВАТАРКИ (ЧЕРЕЗ ПРОКСИ) ===
            const avatarEl = document.getElementById('avatar_' + name);
            if (user.profileImageURL && !avatarEl.querySelector('img')) {
                // Используем сервис weserv.nl для обхода блокировок CDN Twitch
                const proxiedUrl = `https://images.weserv.nl/?url=${encodeURIComponent(user.profileImageURL.replace('https://', ''))}`;
                
                avatarEl.innerHTML = `<img src="${proxiedUrl}" alt="${name}" referrerpolicy="no-referrer" 
                    onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=${name}&background=9147ff&color=fff&size=100&bold=true'">`;
            }
            // ======================================================

            const stream = user.stream;
            if (stream) {
                card.classList.add('live');
                document.getElementById('status_' + name).innerText = 'В ЭФИРЕ';
                document.getElementById('title_' + name).innerText = stream.title;
                document.getElementById('game_' + name).innerText = stream.game ? stream.game.name : '—';
                document.getElementById('viewers_' + name).innerText = stream.viewersCount + ' зрителей';
                
                if (!timers[name]) {
                    const start = new Date(stream.createdAt).getTime();
                    timers[name] = setInterval(() => {
                        const diff = Date.now() - start;
                        const h = Math.floor(diff / 3600000);
                        const m = Math.floor((diff % 3600000) / 60000);
                        const s = Math.floor((diff % 60000) / 1000);
                        const timeEl = document.getElementById('time_' + name);
                        if (timeEl) timeEl.innerText = `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                    }, 1000);
                }
            } else {
                card.classList.remove('live');
                document.getElementById('status_' + name).innerText = 'ОФФЛАЙН';
                if (timers[name]) { clearInterval(timers[name]); delete timers[name]; }
            }
        } catch (e) {
            const statusEl = document.getElementById('status_' + name);
            if (statusEl) statusEl.innerText = 'Ошибка';
        }
    }

    document.getElementById('channelInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') addChannel(); });

    renderChannels();
    renderPlayers();
    setInterval(() => { if (!document.hidden) channels.forEach(name => checkStatus(name)); }, 60000);
</script>
</body>
</html>
