<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Stream Pulse</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #0e0e10; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 1200px; }
        h1 { text-align: center; margin-bottom: 20px; color: #9147ff; }
        
        .controls { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #18181b; color: #fff; font-size: 16px; }
        button { padding: 12px 20px; border-radius: 8px; border: none; background: #9147ff; color: #fff; font-weight: bold; cursor: pointer; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
        .card { background: #18181b; border: 1px solid #333; border-radius: 12px; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .card.live { border-color: #00ff88; }
        
        .card-header { display: flex; justify-content: space-between; align-items: center; }
        .card-title { font-weight: 800; font-size: 1.1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .remove-btn { background: #ff4d6d; padding: 5px 10px; font-size: 12px; }
        
        .status { font-size: 0.9rem; font-weight: bold; color: #ff4d6d; }
        .card.live .status { color: #00ff88; }
        
        .info { display: none; background: #000; padding: 10px; border-radius: 8px; font-size: 0.9rem; }
        .card.live .info { display: block; }
        .info div { margin-bottom: 5px; }
        
        .watch-btn { display: none; width: 100%; margin-top: 10px; }
        .card.live .watch-btn { display: block; }

        .player-wrapper { margin-top: 20px; display: none; flex-direction: column; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid #333; }
        .player-wrapper.active { display: flex; }
        .player-header { padding: 10px; background: #18181b; display: flex; justify-content: space-between; }
        .iframe-container { width: 100%; aspect-ratio: 16/9; }
        .iframe-container iframe { width: 100%; height: 100%; border: none; }
        .chat-container { width: 100%; height: 400px; display: none; }
        .chat-container iframe { width: 100%; height: 100%; border: none; }
        
        @media (min-width: 900px) {
            .player-body { display: flex; flex-direction: row; }
            .iframe-container { width: 70%; aspect-ratio: auto; height: 500px; }
            .chat-container { display: block; width: 30%; height: 500px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Stream Pulse</h1>
    <div class="controls">
        <input type="text" id="channelInput" placeholder="Введите ник (frik0vna)">
        <button onclick="addChannel()">Добавить</button>
    </div>

    <div class="grid" id="grid"></div>

    <div class="player-wrapper" id="playerWrapper">
        <div class="player-header">
            <span id="playerTitle">Плеер</span>
            <button class="remove-btn" onclick="closePlayer()">Закрыть</button>
        </div>
        <div class="player-body">
            <div class="iframe-container" id="videoBox"></div>
            <div class="chat-container" id="chatBox"></div>
        </div>
    </div>
</div>

<script>
    const CLIENT_ID = 'kimne78kx3ncx6brgo4mv6wki5h1ko';
    const PARENT = 'kingjo226.github.io';
    let channels = JSON.parse(localStorage.getItem('twitch_channels')) || ['frik0vna'];
    let currentActive = null;

    function save() { localStorage.setItem('twitch_channels', JSON.stringify(channels)); }
    function escapeHTML(str) { return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)); }

    function addChannel() {
        const input = document.getElementById('channelInput');
        const name = input.value.trim().toLowerCase();
        if (!name || channels.includes(name)) return;
        channels.push(name);
        save();
        input.value = '';
        render();
        checkStatus(name);
    }

    function removeChannel(name) {
        channels = channels.filter(c => c !== name);
        save();
        if (currentActive === name) closePlayer();
        render();
    }

    function openPlayer(name) {
        currentActive = name;
        document.getElementById('playerWrapper').classList.add('active');
        document.getElementById('playerTitle').innerText = 'Смотрим: ' + name;
        
        document.getElementById('videoBox').innerHTML = `<iframe src="https://player.twitch.tv/?channel=${name}&parent=${PARENT}&autoplay=true&muted=true" allowfullscreen></iframe>`;
        document.getElementById('chatBox').innerHTML = `<iframe src="https://www.twitch.tv/embed/${name}/chat?parent=${PARENT}&darkpopout"></iframe>`;
        
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    function closePlayer() {
        currentActive = null;
        document.getElementById('playerWrapper').classList.remove('active');
        document.getElementById('videoBox').innerHTML = '';
        document.getElementById('chatBox').innerHTML = '';
    }

    function render() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        channels.forEach(name => {
            const card = document.createElement('div');
            card.className = 'card';
            card.id = 'card_' + name;
            card.innerHTML = `
                <div class="card-header">
                    <div class="card-title">${escapeHTML(name)}</div>
                    <button class="remove-btn" onclick="removeChannel('${escapeHTML(name)}')">X</button>
                </div>
                <div class="status" id="status_${name}">Проверка...</div>
                <div class="info">
                    <div id="title_${name}" style="font-weight:bold; color:#fff; margin-bottom:8px;"></div>
                    <div id="game_${name}" style="color:#aaa;"></div>
                    <div id="viewers_${name}" style="color:#00ff88; margin-top:5px;"></div>
                    <div id="time_${name}" style="color:#9147ff; margin-top:5px;"></div>
                </div>
                <button class="watch-btn" onclick="openPlayer('${escapeHTML(name)}')">▶ Смотреть</button>
            `;
            grid.appendChild(card);
            checkStatus(name);
        });
    }

    async function checkStatus(name) {
        const query = {
            query: `query($login: String!) { user(login: $login) { displayName stream { title viewersCount createdAt game { name } } } }`,
            variables: { login: name }
        };
        try {
            const res = await fetch('https://gql.twitch.tv/gql', {
                method: 'POST',
                headers: { 'Client-ID': CLIENT_ID, 'Content-Type': 'application/json' },
                body: JSON.stringify(query)
            });
            const json = await res.json();
            const user = json.data.user;
            
            const card = document.getElementById('card_' + name);
            if (!card) return;

            if (!user) {
                document.getElementById('status_' + name).innerText = 'Не найден';
                card.classList.remove('live');
                return;
            }

            const stream = user.stream;
            if (stream) {
                card.classList.add('live');
                document.getElementById('status_' + name).innerText = 'В ЭФИРЕ';
                document.getElementById('title_' + name).innerText = stream.title;
                document.getElementById('game_' + name).innerText = stream.game ? stream.game.name : 'Без категории';
                document.getElementById('viewers_' + name).innerText = stream.viewersCount + ' зрителей';
                
                // Таймер
                const start = new Date(stream.createdAt).getTime();
                setInterval(() => {
                    const diff = Date.now() - start;
                    const h = Math.floor(diff / 3600000);
                    const m = Math.floor((diff % 3600000) / 60000);
                    const s = Math.floor((diff % 60000) / 1000);
                    document.getElementById('time_' + name).innerText = `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                }, 1000);

            } else {
                card.classList.remove('live');
                document.getElementById('status_' + name).innerText = 'ОФФЛАЙН';
            }
        } catch (e) {
            document.getElementById('status_' + name).innerText = 'Ошибка';
        }
    }

    document.getElementById('channelInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') addChannel();
    });

    render();
</script>
</body>
</html>
