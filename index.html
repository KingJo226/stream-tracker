<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0e0e10">
    <title>Stream Pulse</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        /* Основной фон и контейнер */
        body { 
            background: #0e0e10; 
            color: #efeff1; 
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        .container { 
            width: 100%; 
            max-width: 1400px; 
            padding: 20px; 
            padding-bottom: 50px;
        }
        
        h1 { text-align: center; margin-bottom: 20px; color: #fff; font-size: 1.8rem; }
        
        /* Поле ввода */
        .controls { display: flex; gap: 10px; margin-bottom: 20px; }
        input { 
            flex: 1; padding: 12px 16px; border-radius: 8px; border: 1px solid #333; 
            background: #18181b; color: #fff; font-size: 16px; outline: none; 
        }
        input:focus { border-color: #9147ff; }
        button { 
            padding: 12px 24px; border-radius: 8px; border: none; 
            background: #9147ff; color: #fff; font-weight: bold; cursor: pointer; 
            font-size: 16px; transition: background 0.2s;
        }
        button:active { background: #7a35e6; }
        
        /* Сетка карточек */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .card { 
            background: #18181b; border: 1px solid #333; border-radius: 12px; 
            padding: 16px; display: flex; flex-direction: column; gap: 12px; 
            transition: border-color 0.3s;
        }
        .card.live { border-color: #00ff88; }
        
        .card-header { display: flex; justify-content: space-between; align-items: center; }
        .card-title { font-weight: 800; font-size: 1.1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .remove-btn { background: #ff4d6d; padding: 6px 12px; font-size: 12px; border-radius: 6px; }
        .remove-btn:active { background: #e63e5c; }
        
        .status { font-size: 0.9rem; font-weight: bold; color: #ff4d6d; }
        .card.live .status { color: #00ff88; }
        
        .info { display: none; background: #000; padding: 12px; border-radius: 8px; font-size: 0.9rem; }
        .card.live .info { display: block; }
        .info-title { font-weight: 600; color: #fff; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .info-game { color: #adadb8; margin-bottom: 6px; }
        .info-viewers { color: #00ff88; font-weight: bold; }
        .info-time { color: #bf94ff; margin-top: 6px; }
        
        .watch-btn { display: none; width: 100%; background: #9147ff; margin-top: auto; }
        .card.live .watch-btn { display: block; }

        /* ===== ПЛЕЕР ===== */
        .player-wrapper { 
            display: none; 
            flex-direction: column; 
            background: #000; 
            border-radius: 12px; 
            overflow: hidden; 
            border: 1px solid #333; 
            margin-top: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .player-wrapper.active { display: flex; }
        
        .player-header { 
            padding: 12px 16px; 
            background: #18181b; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border-bottom: 1px solid #333;
        }
        .player-title { font-weight: bold; color: #fff; }
        
        .player-body { display: flex; flex-direction: column; width: 100%; }
        
        /* Видео */
        .video-box { width: 100%; aspect-ratio: 16/9; background: #000; position: relative; }
        .video-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        /* Чат */
        .chat-box { width: 100%; height: 400px; background: #18181b; border-top: 1px solid #333; position: relative; }
        .chat-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        /* ===== АДАПТИВ ПОД ПК ===== */
        @media (min-width: 900px) {
            .player-body { flex-direction: row; }
            .video-box { width: 70%; aspect-ratio: auto; height: 500px; }
            .chat-box { width: 30%; height: 500px; border-top: none; border-left: 1px solid #333; }
        }

        /* ===== АДАПТИВ ПОД ТЕЛЕФОН ===== */
        @media (max-width: 899px) {
            .container { padding: 10px; }
            h1 { font-size: 1.4rem; margin-bottom: 15px; }
            .controls { flex-direction: column; gap: 8px; }
            input, button { width: 100%; padding: 14px; }
            .grid { grid-template-columns: 1fr; }
            .video-box { aspect-ratio: 16/9; }
            .chat-box { height: 450px; } /* Высота чата как в приложении */
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Stream Pulse</h1>
    
    <div class="controls">
        <input type="text" id="channelInput" placeholder="Введите ник (например, frik0vna)" autocomplete="off">
        <button onclick="addChannel()">Добавить</button>
    </div>

    <div class="grid" id="grid"></div>

    <!-- Блок плеера -->
    <div class="player-wrapper" id="playerWrapper">
        <div class="player-header">
            <span class="player-title" id="playerTitle">Плеер</span>
            <button class="remove-btn" onclick="closePlayer()">Закрыть</button>
        </div>
        <div class="player-body">
            <div class="video-box" id="videoBox"></div>
            <div class="chat-box" id="chatBox"></div>
        </div>
    </div>
</div>

<script>
    const CLIENT_ID = 'kimne78kx3ncx6brgo4mv6wki5h1ko';
    const PARENT = 'kingjo226.github.io';
    
    // Загружаем каналы из памяти или ставим дефолтный
    let channels = JSON.parse(localStorage.getItem('twitch_channels')) || ['frik0vna'];
    
    // Чтобы не было багов с таймерами на телефоне
    let timers = {};
    let currentActive = null;

    function save() { localStorage.setItem('twitch_channels', JSON.stringify(channels)); }
    function escapeHTML(str) { return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)); }

    function addChannel() {
        const input = document.getElementById('channelInput');
        const name = input.value.trim().toLowerCase();
        if (!name || channels.includes(name)) return;
        
        channels.push(name);
        save();
        input.value = '';
        render();
    }

    function removeChannel(name) {
        channels = channels.filter(c => c !== name);
        save();
        if (currentActive === name) closePlayer();
        if (timers[name]) { clearInterval(timers[name]); delete timers[name]; }
        render();
    }

    // ===== ЛОГИКА ПЛЕЕРА =====
    function openPlayer(name) {
        currentActive = name;
        document.getElementById('playerWrapper').classList.add('active');
        document.getElementById('playerTitle').innerText = 'Смотрим: ' + name;
        
        // Встраиваем видео и чат
        document.getElementById('videoBox').innerHTML = `<iframe src="https://player.twitch.tv/?channel=${name}&parent=${PARENT}&autoplay=true&muted=true" allowfullscreen allow="autoplay; fullscreen"></iframe>`;
        document.getElementById('chatBox').innerHTML = `<iframe src="https://www.twitch.tv/embed/${name}/chat?parent=${PARENT}&darkpopout"></iframe>`;
        
        // Плавный скролл к плееру
        document.getElementById('playerWrapper').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function closePlayer() {
        currentActive = null;
        document.getElementById('playerWrapper').classList.remove('active');
        document.getElementById('videoBox').innerHTML = ''; // Удаляем iframe, чтобы не жрал ресурсы
        document.getElementById('chatBox').innerHTML = '';
    }

    // ===== ОТРИСОВКА КАРТОЧЕК =====
    function render() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        
        channels.forEach(name => {
            const card = document.createElement('div');
            card.className = 'card';
            card.id = 'card_' + name;
            card.innerHTML = `
                <div class="card-header">
                    <div class="card-title">${escapeHTML(name)}</div>
                    <button class="remove-btn" onclick="removeChannel('${escapeHTML(name)}')">✕</button>
                </div>
                <div class="status" id="status_${name}">Проверка...</div>
                <div class="info">
                    <div class="info-title" id="title_${name}">Загрузка...</div>
                    <div class="info-game" id="game_${name}"></div>
                    <div class="info-viewers" id="viewers_${name}"></div>
                    <div class="info-time" id="time_${name}">00:00:00</div>
                </div>
                <button class="watch-btn" onclick="openPlayer('${escapeHTML(name)}')">▶ Смотреть</button>
            `;
            grid.appendChild(card);
            checkStatus(name);
        });
    }

    // ===== ПОЛУЧЕНИЕ СТАТУСА ОТ TWITCH =====
    async function checkStatus(name) {
        const query = {
            query: `query($login: String!) { user(login: $login) { displayName stream { title viewersCount createdAt game { name } } } }`,
            variables: { login: name }
        };
        
        try {
            const res = await fetch('https://gql.twitch.tv/gql', {
                method: 'POST',
                headers: { 'Client-ID': CLIENT_ID, 'Content-Type': 'application/json' },
                body: JSON.stringify(query)
            });
            const json = await res.json();
            const user = json.data.user;
            
            const card = document.getElementById('card_' + name);
            if (!card) return;

            if (!user) {
                document.getElementById('status_' + name).innerText = 'Не найден';
                card.classList.remove('live');
                return;
            }

            const stream = user.stream;
            if (stream) {
                card.classList.add('live');
                document.getElementById('status_' + name).innerText = 'В ЭФИРЕ';
                document.getElementById('title_' + name).innerText = stream.title;
                document.getElementById('game_' + name).innerText = stream.game ? stream.game.name : 'Без категории';
                document.getElementById('viewers_' + name).innerText = stream.viewersCount + ' зрителей';
                
                // Запускаем таймер, только если его еще нет (защита от лагов)
                if (!timers[name]) {
                    const start = new Date(stream.createdAt).getTime();
                    timers[name] = setInterval(() => {
                        const diff = Date.now() - start;
                        const h = Math.floor(diff / 3600000);
                        const m = Math.floor((diff % 3600000) / 60000);
                        const s = Math.floor((diff % 60000) / 1000);
                        const timeStr = `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                        
                        const timeEl = document.getElementById('time_' + name);
                        if (timeEl) timeEl.innerText = timeStr;
                    }, 1000);
                }

            } else {
                card.classList.remove('live');
                document.getElementById('status_' + name).innerText = 'ОФФЛАЙН';
                if (timers[name]) { clearInterval(timers[name]); delete timers[name]; }
            }
        } catch (e) {
            const statusEl = document.getElementById('status_' + name);
            if (statusEl) statusEl.innerText = 'Ошибка сети';
        }
    }

    // Слушатели событий
    document.getElementById('channelInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') addChannel();
    });

    // Запуск при загрузке
    render();
</script>
</body>
</html>
